# CI: 빌드/타입체크/테스트 (make.md §5 CI/CD - CodeBuild(테스트) 단계에 대응)
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    name: 백엔드 빌드/테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ticket-booking/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ticket-booking/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: 프론트엔드 빌드/타입체크
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ticket-booking/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ticket-booking/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  terraform:
    name: Terraform 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt & validate (dev)
        working-directory: ticket-booking/infra/terraform
        run: |
          terraform fmt -check -recursive
          cd envs/dev
          terraform init -backend=false
          terraform validate
