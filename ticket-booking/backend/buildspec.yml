version: 0.2

# CodeBuild buildspec - 백엔드 이미지 빌드, ECR push, ECS 배포 아티팩트 생성
# 주입 환경변수: AWS_ACCOUNT_ID, AWS_DEFAULT_REGION, ECR_REPO_URL, CONTAINER_NAME

phases:
  pre_build:
    commands:
      - 'echo Logging in to ECR'
      - 'aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"'
      - 'IMAGE_TAG=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}" | cut -c1-8)'
  build:
    commands:
      - 'echo Building backend image with context ticket-booking'
      - 'cd ticket-booking'
      - 'docker build -f backend/Dockerfile -t "$ECR_REPO_URL:$IMAGE_TAG" -t "$ECR_REPO_URL:latest" .'
  post_build:
    commands:
      - 'echo Pushing image to ECR'
      - 'docker push "$ECR_REPO_URL:$IMAGE_TAG"'
      - 'docker push "$ECR_REPO_URL:latest"'
      - 'echo Writing imagedefinitions.json'
      - 'printf "[{\"name\":\"%s\",\"imageUri\":\"%s\"}]" "$CONTAINER_NAME" "$ECR_REPO_URL:$IMAGE_TAG" > imagedefinitions.json'
      - 'cat imagedefinitions.json'

artifacts:
  files:
    - 'ticket-booking/imagedefinitions.json'
  discard-paths: yes
